# Matrix-element LHE generation for a rough HEFT estimate of:
#   g g -> h b bbar b bbar b bbar, with h -> b bbar
#
# The production process is restricted to the HEFT Higgs-gluon coupling.  The
# Higgs decay follows the Herwig signal-card convention used in this repository:
# h -> b bbar is forced and the production cross section is not multiplied by
# the SM Higgs branching ratio.

EVENTS: 200
MPI_EVENT_MODE: 1
MPI_SEED_MODE: 1
BATCH_MODE: 5
EVENT_DISPLAY_INTERVAL: 100
EVENT_GENERATION_MODE: PartiallyUnweighted
EVENT_OUTPUT: LHEF[gg_heft_h_3bbbar_hbb]
EVT_FILE_PATH: .
EVENT_OUTPUT_PRECISION: 12
COLOR_SCHEME: SAMPLE
RESULT_DIRECTORY: Results_PartiallyUnweighted

SP:
  SET_COLORS: true
  LHE_COLOR_FLOW_HACK: true
  LHE_COLOR_FLOW_DEBUG: false

LHEF_ASSIGN_MISSING_QQBAR_SINGLET: true
LHEF_ENFORCE_BEAM_ORDER: true

BEAMS: 2212
BEAM_ENERGIES: 7000
BEAM_SPECTRA: Monochromatic
PDF_LIBRARY: LHAPDFSherpa
PDF_SET: NNPDF23_nlo_as_0119
MPI_PDF_LIBRARY: LHAPDFSherpa
MPI_PDF_SET: NNPDF23_nlo_as_0119
ALPHAS: {USE_PDF: 1}

SHOWER_GENERATOR: None
FRAGMENTATION: None
MI_HANDLER: None
BEAM_REMNANTS: false
ME_QED: {ENABLED: false}
YFS: {MODE: off}

MODEL: HEFT
EW_SCHEME: 3
GF: 1.1663787e-5

HARD_DECAYS:
  Enabled: true
  Channels:
    25,5,-5: {Status: 2}
  Apply_Branching_Ratios: false
  Use_HO_SM_Widths: false

ME_GENERATORS: Comix
SCALES: VAR{0.25*(H_T2+sqr(125.0))}{0.25*(H_T2+sqr(125.0))}

PSI:
  MAXOPT: 4
  STOPOPT: 4

PARTICLE_DATA:
  5:
    Massive: true
    Mass: 4.75
  25:
    Mass: 125.0
    Width: 0.0041
    Stable: 0
    Narrow: 1

PROCESSES:
- 21 21 -> 25 5 -5 5 -5 5 -5:
    Sort_Flavors: 1
    Order: {QCD: Any, EW: 0, HEFT: 1}
    ME_Generator: Comix
    Integration_Error: 0.05

SELECTORS:
- [PT, 5, 15.0, E_CMS]
- [PT, -5, 15.0, E_CMS]
- [Eta, 5, -3.0, 3.0]
- [Eta, -5, -3.0, 3.0]
- [DR, 5, 5, 0.3, E_CMS]
- [DR, -5, -5, 0.3, E_CMS]
- [DR, 5, -5, 0.3, E_CMS]
