# Matrix-element-only LHE configuration for:
#   g g -> h h b bbar b bbar
# using the Sherpa-adapted heft_c3d4 UFO model.  The inclusive amplitude
# bounds retain the bottom-Yukawa diagrams admitted by the existing
# unqualified MadGraph process.  Both Higgs bosons remain stable for Herwig.

TAGS: {C3: 0.0}

EVENTS: 200
MPI_EVENT_MODE: 1
MPI_SEED_MODE: 1
BATCH_MODE: 5
EVENT_DISPLAY_INTERVAL: 100
EVENT_GENERATION_MODE: PartiallyUnweighted
EVENT_OUTPUT: LHEF[gg_hh_2bbbar_ufo_heft]
EVT_FILE_PATH: .
EVENT_OUTPUT_PRECISION: 12
COLOR_SCHEME: SAMPLE
RESULT_DIRECTORY: Results_PartiallyUnweighted

SP:
  SET_COLORS: true
  LHE_COLOR_FLOW_HACK: true
  LHE_COLOR_FLOW_DEBUG: false

LHEF_ENFORCE_BEAM_ORDER: true

BEAMS: 2212
BEAM_ENERGIES: 7000
BEAM_SPECTRA: Monochromatic
PDF_LIBRARY: LHAPDFSherpa
PDF_SET: NNPDF23_nlo_as_0119
MPI_PDF_LIBRARY: LHAPDFSherpa
MPI_PDF_SET: NNPDF23_nlo_as_0119
ALPHAS: {USE_PDF: 1}

SHOWER_GENERATOR: None
FRAGMENTATION: None
MI_HANDLER: None
BEAM_REMNANTS: false
ME_QED: {ENABLED: false}
YFS: {MODE: off}
HARD_DECAYS: {Enabled: false}

MODEL: heft_c3d4_sherpa
UFO_PARAM_CARD: param_heft_c3d4_sherpa.dat
ME_GENERATORS: Comix
SCALES: VAR{0.25*(H_T2+sqr(2*125.0))}{0.25*(H_T2+sqr(2*125.0))}

PSI:
  MAXOPT: 4
  STOPOPT: 4

PROCESSES:
- 21 21 -> 25 25 5 -5 5 -5:
    Sort_Flavors: 1
    Min_Amplitude_Order: {QCD: 4, QED: 0, HIG: 0, HIW: 0}
    Max_Amplitude_Order: {QCD: 6, QED: 2, HIG: 1, HIW: 1}
    ME_Generator: Comix
    Integration_Error: 0.05

SELECTORS:
- [PT, 5, 15.0, E_CMS]
- [PT, -5, 15.0, E_CMS]
- [Eta, 5, -3.0, 3.0]
- [Eta, -5, -3.0, 3.0]
- [DR, 5, 5, 0.3, E_CMS]
- [DR, -5, -5, 0.3, E_CMS]
- [DR, 5, -5, 0.3, E_CMS]
