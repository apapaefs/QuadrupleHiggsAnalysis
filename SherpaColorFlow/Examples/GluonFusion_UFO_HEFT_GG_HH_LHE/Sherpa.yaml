# Matrix-element-only LHE configuration for:
#   g g -> h h
# using the Sherpa-adapted heft_c3d4 UFO model.  Both Higgs bosons remain
# stable and are intended to be decayed later by Herwig.

TAGS: {C3: 0.0}

EVENTS: 200
MPI_EVENT_MODE: 1
MPI_SEED_MODE: 1
BATCH_MODE: 5
EVENT_DISPLAY_INTERVAL: 100
EVENT_GENERATION_MODE: PartiallyUnweighted
EVENT_OUTPUT: LHEF[gg_hh_ufo_heft]
EVT_FILE_PATH: .
EVENT_OUTPUT_PRECISION: 12
COLOR_SCHEME: SAMPLE
RESULT_DIRECTORY: Results_PartiallyUnweighted

SP:
  SET_COLORS: true
  LHE_COLOR_FLOW_HACK: true
  LHE_COLOR_FLOW_DEBUG: false

LHEF_ENFORCE_BEAM_ORDER: true

BEAMS: 2212
BEAM_ENERGIES: 7000
BEAM_SPECTRA: Monochromatic
PDF_LIBRARY: LHAPDFSherpa
PDF_SET: NNPDF23_nlo_as_0119
MPI_PDF_LIBRARY: LHAPDFSherpa
MPI_PDF_SET: NNPDF23_nlo_as_0119
ALPHAS: {USE_PDF: 1}

SHOWER_GENERATOR: None
FRAGMENTATION: None
MI_HANDLER: None
BEAM_REMNANTS: false
ME_QED: {ENABLED: false}
YFS: {MODE: off}
HARD_DECAYS: {Enabled: false}

MODEL: heft_c3d4_sherpa
UFO_PARAM_CARD: param_heft_c3d4_sherpa.dat
ME_GENERATORS: Comix
SCALES: VAR{0.25*(H_T2+sqr(2*125.0))}{0.25*(H_T2+sqr(2*125.0))}

PSI:
  MAXOPT: 4
  STOPOPT: 4

PROCESSES:
- 21 21 -> 25 25:
    Sort_Flavors: 1
    Min_Amplitude_Order: {QCD: 2, QED: 0, HIG: 1, HIW: 0}
    Max_Amplitude_Order: {QCD: 2, QED: 1, HIG: 1, HIW: 0}
    ME_Generator: Comix
    # The graph-derived Comix channel has no propagator channel when c3=-1,
    # where only the four-point ggHH contact interaction remains.  Use
    # Sherpa's dedicated, independently validated massive 2->2 map.
    Integrator: SChannel
    Integration_Error: 0.005

SELECTORS: []
