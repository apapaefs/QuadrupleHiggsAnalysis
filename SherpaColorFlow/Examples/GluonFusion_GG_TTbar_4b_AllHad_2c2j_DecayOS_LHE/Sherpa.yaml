# Matrix-element-only LHE generation for:
#   g g -> t tbar b bbar b bbar
#   t -> b W+, tbar -> bbar W-, W+ -> c sbar, W- -> cbar s
#
# This is the all-hadronic ttbar+4b category with two charm quarks from W
# decays, i.e. six real b quarks, c cbar, and two light partons.

EVENTS: 200
MPI_EVENT_MODE: 1
MPI_SEED_MODE: 1
BATCH_MODE: 5
EVENT_DISPLAY_INTERVAL: 100
EVENT_GENERATION_MODE: PartiallyUnweighted
EVENT_OUTPUT: LHEF[ttbar_4b_allhad_2c2j_decayos]
EVT_FILE_PATH: .
EVENT_OUTPUT_PRECISION: 12
COLOR_SCHEME: SAMPLE
RESULT_DIRECTORY: Results_PartiallyUnweighted

SP:
  SET_COLORS: true
  LHE_COLOR_FLOW_HACK: true
  LHE_COLOR_FLOW_DEBUG: false

LHEF_ASSIGN_MISSING_QQBAR_SINGLET: true
LHEF_ENFORCE_BEAM_ORDER: true

BEAMS: 2212
BEAM_ENERGIES: 7000
BEAM_SPECTRA: Monochromatic
PDF_LIBRARY: LHAPDFSherpa
PDF_SET: NNPDF23_nlo_as_0119
MPI_PDF_LIBRARY: LHAPDFSherpa
MPI_PDF_SET: NNPDF23_nlo_as_0119

SHOWER_GENERATOR: None
FRAGMENTATION: None
MI_HANDLER: None
BEAM_REMNANTS: false
ME_QED: {ENABLED: false}
YFS: {MODE: off}

ME_GENERATORS: Comix
SCALES: VAR{0.25*(H_T2+sqr(2*172.5))}{0.25*(H_T2+sqr(2*172.5))}

PSI:
  MAXOPT: 4
  STOPOPT: 4

PARTICLE_CONTAINERS:
  901: {Name: lightjets, Flavs: [1, -1, 2, -2, 3, -3, 21]}

PARTICLE_DATA:
  4:
    Massive: true
    Mass: 1.5
  5:
    Massive: true
    Mass: 4.75
# DecayOS uses these finite widths in the narrow-width normalization.
  6:
    Width: 1.32
  24:
    Width: 2.085

# Keep Order unset for these DecayOS blocks; Sherpa 3.1.x applies fixed
# order filters before accepting the cascade and can drop the process.
PROCESSES:
- 21 21 -> 6[a] -6[b] 5 -5 5 -5:
    DecayOS:
    - 6[a] -> 5 24[c]
    - -6[b] -> -5 -24[d]
    - 24[c] -> 4 -3
    - -24[d] -> -4 3
    ME_Generator: Comix
    Integration_Error: 0.05

SELECTORS:
- [PT, 5, 15.0, E_CMS]
- [PT, -5, 15.0, E_CMS]
- [PT, 4, 15.0, E_CMS]
- [PT, -4, 15.0, E_CMS]
- [PT, 901, 15.0, E_CMS]
- [Eta, 5, -3.0, 3.0]
- [Eta, -5, -3.0, 3.0]
- [Eta, 4, -3.0, 3.0]
- [Eta, -4, -3.0, 3.0]
- [Eta, 901, -3.0, 3.0]
- [DR, 5, 5, 0.3, E_CMS]
- [DR, -5, -5, 0.3, E_CMS]
- [DR, 5, -5, 0.3, E_CMS]
- [DR, 4, -4, 0.3, E_CMS]
- [DR, 901, 901, 0.3, E_CMS]
- [DR, 5, 4, 0.3, E_CMS]
- [DR, 5, -4, 0.3, E_CMS]
- [DR, -5, 4, 0.3, E_CMS]
- [DR, -5, -4, 0.3, E_CMS]
- [DR, 5, 901, 0.3, E_CMS]
- [DR, -5, 901, 0.3, E_CMS]
- [DR, 4, 901, 0.3, E_CMS]
- [DR, -4, 901, 0.3, E_CMS]
